<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HarnessGuard</title>
<style>
  :root { --bg:#101418; --panel:#1a2129; --fg:#dbe4ee; --dim:#7d8b9c; --acc:#4da3ff; --bad:#ff5d5d; --warn:#ffb84d; --ok:#5dd97c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 "Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:16px; align-items:center; padding:10px 20px; background:var(--panel); border-bottom:1px solid #2a3542; }
  header h1 { font-size:16px; margin:0; }
  nav button { background:none; border:none; color:var(--dim); font-size:14px; padding:6px 12px; cursor:pointer; border-bottom:2px solid transparent; }
  nav button.on { color:var(--fg); border-bottom-color:var(--acc); }
  main { padding:16px 20px; max-width:1100px; margin:0 auto; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .card { background:var(--panel); border-radius:8px; padding:12px 16px; min-width:150px; }
  .card .n { font-size:22px; font-weight:600; }
  .card .l { color:var(--dim); font-size:12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:8px; overflow:hidden; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid #2a3542; font-size:13px; }
  th { color:var(--dim); font-weight:500; }
  .tag { padding:1px 8px; border-radius:10px; font-size:12px; }
  .tag.block { background:#3d1b1b; color:var(--bad); }
  .tag.audit { background:#3d2f14; color:var(--warn); }
  .tag.allow { background:#16321f; color:var(--ok); }
  .row { cursor:pointer; }
  .row:hover { background:#202a35; }
  #detail { position:fixed; right:0; top:0; bottom:0; width:420px; background:var(--panel); border-left:1px solid #2a3542; padding:16px; overflow:auto; display:none; }
  #detail pre { white-space:pre-wrap; word-break:break-all; background:#0d1117; padding:10px; border-radius:6px; }
  input,select { background:#0d1117; border:1px solid #2a3542; color:var(--fg); padding:6px 8px; border-radius:6px; }
  button.act { background:var(--acc); color:#08151f; border:none; border-radius:6px; padding:6px 14px; cursor:pointer; font-weight:600; }
  button.mini { background:#2a3542; color:var(--fg); border:none; border-radius:6px; padding:3px 10px; cursor:pointer; }
  .bar { padding:8px 12px; border-radius:6px; margin-bottom:12px; display:none; }
  .bar.err { display:block; background:#3d1b1b; color:var(--bad); }
  #token-setup { position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:9; }
  small.dim { color:var(--dim); }
  textarea { width:100%; height:360px; background:#0d1117; color:var(--fg); border:1px solid #2a3542; border-radius:6px; font:12px/1.4 Consolas,monospace; padding:8px; }
</style>
</head>
<body>
<div id="token-setup">
  <h2>HarnessGuard 需要访问令牌</h2>
  <small class="dim">请使用服务启动时打印的带 token 的 URL 打开，或粘贴 token：</small>
  <input id="token-input" placeholder="粘贴 token" style="width:320px">
  <button class="act" onclick="saveToken()">进入</button>
</div>
<header>
  <h1>HarnessGuard</h1>
  <nav>
    <button data-p="dash" class="on" onclick="page('dash')">Dashboard</button>
    <button data-p="events" onclick="page('events')">事件流</button>
    <button data-p="procs" onclick="page('procs')">进程</button>
    <button data-p="wl" onclick="page('wl')">白名单</button>
    <button data-p="cfg" onclick="page('cfg')">设置</button>
  </nav>
  <span id="conn-dot" title="API 状态" style="margin-left:auto">●</span>
</header>
<main>
  <div class="bar" id="err"></div>

  <section id="p-dash">
    <div class="cards" id="cards"></div>
    <h3>最近判定（点击行查看证据）</h3>
    <table><thead><tr><th>时间</th><th>动作</th><th>规则</th><th>进程</th><th>摘要</th></tr></thead>
    <tbody id="vrows"></tbody></table>
  </section>

  <section id="p-events" style="display:none">
    <h3>审计事件流</h3>
    <table><thead><tr><th>时间</th><th>类型</th><th>PID</th><th>详情</th></tr></thead>
    <tbody id="erows"></tbody></table>
  </section>

  <section id="p-procs" style="display:none">
    <h3>进程身份表（监控树内）</h3>
    <table><thead><tr><th>PID</th><th>可执行</th><th>命令行</th><th>监控根</th><th>豁免</th></tr></thead>
    <tbody id="prows"></tbody></table>
  </section>

  <section id="p-wl" style="display:none">
    <h3>白名单（端点 / 路径 / 进程）</h3>
    <p><select id="wl-kind"><option>endpoint</option><option>path</option><option>proc</option></select>
    <input id="wl-value" placeholder="值（域名 glob / 路径 / 进程名）" style="width:300px">
    <input id="wl-note" placeholder="备注" style="width:180px">
    <button class="act" onclick="wlAdd()">添加</button></p>
    <table><thead><tr><th>ID</th><th>类型</th><th>值</th><th>备注</th><th></th></tr></thead>
    <tbody id="wrows"></tbody></table>
  </section>

  <section id="p-cfg" style="display:none">
    <h3>配置（TOML，保存后热生效）</h3>
    <p><button class="act" onclick="cfgSave()">保存并应用</button>
    <button class="mini" onclick="cfgReload()">放弃修改重新加载</button></p>
    <textarea id="cfg-text" spellcheck="false"></textarea>
  </section>
</main>

<div id="detail"><h3>判定证据</h3><pre id="detail-body"></pre>
<button class="mini" onclick="document.getElementById('detail').style.display='none'">关闭</button></div>

<script>
const $ = id => document.getElementById(id);
let TOKEN = localStorage.getItem('hg_token') || new URLSearchParams(location.search).get('token');
if (TOKEN) localStorage.setItem('hg_token', TOKEN);
if (!TOKEN) { $('token-setup').style.display = 'flex'; }
function saveToken(){ TOKEN = $('token-input').value.trim(); localStorage.setItem('hg_token', TOKEN); location.search=''; location.reload(); }

async function api(path, opts={}) {
  const r = await fetch(path, Object.assign(opts, {headers:{Authorization:'Bearer '+TOKEN}}));
  if (r.status === 401) { $('err').textContent='token 失效'; $('err').className='bar err'; throw 0; }
  $('conn-dot').style.color = '#5dd97c';
  return r;
}
function fail(e){ $('conn-dot').style.color='#ff5d5d'; }
function ts(t){ return t ? new Date(t).toLocaleTimeString() : '-'; }
function esc(s){ return String(s??'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function page(p){
  for (const s of ['dash','events','procs','wl','cfg']) $('p-'+s).style.display = s===p?'':'none';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.p===p));
  if (p==='events') loadEvents(); if (p==='procs') loadProcs(); if (p==='wl') loadWl(); if (p==='cfg') cfgLoad();
}

async function loadStatus(){
  try{
    const s = await (await api('/api/status')).json();
    const uk = s.source.file_unknown, rr = s.source.file_resolved;
    $('cards').innerHTML = [
      ['运行', s.uptime_s+' s'],
      ['判定总数', s.engine.verdicts],
      ['阻断', '<span style="color:var(--bad)">'+s.engine.blocks+'</span>'],
      ['杀进程', s.engine.kills], ['断连接', s.engine.connections_dropped],
      ['监控进程', s.procs], ['活跃连接', s.conns],
      ['事件(发出/丢)', s.source.events_sent+' / '+s.source.events_dropped_full],
      ['文件路径关联率', rr+uk>0 ? (100*rr/(rr+uk)).toFixed(1)+'%' : '-'],
    ].map(x=>'<div class="card"><div class="n">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>').join('');
  }catch(e){ fail(e); }
}

async function loadVerdicts(){
  try{
    const v = await (await api('/api/verdicts?limit=30')).json();
    $('vrows').innerHTML = v.map(x=>'<tr class="row" onclick="showDetail('+x.id+')"><td>'+ts(x.ts)+'</td>'
      +'<td><span class="tag '+x.action+'">'+x.action+'</span></td><td>'+esc(x.rule_id)+'</td><td>'+esc(x.exe.split(/[\\/]/).pop())+' ('+x.pid+')</td>'
      +'<td>'+esc((x.evidence&&x.evidence.summary)||'')+'</td></tr>').join('');
  }catch(e){ fail(e); }
}
async function showDetail(id){
  const v = await (await api('/api/verdicts?limit=200')).json();
  const x = v.find(a=>a.id===id);
  $('detail-body').textContent = JSON.stringify(x, null, 2);
  $('detail').style.display='block';
}
async function loadEvents(){
  try{
    const v = await (await api('/api/events?limit=100')).json();
    $('erows').innerHTML = v.map(x=>'<tr><td>'+ts(x.ts)+'</td><td>'+esc(x.kind)+'</td><td>'+x.pid+'</td><td><small class="dim">'+esc(JSON.stringify(x.detail))+'</small></td></tr>').join('');
  }catch(e){ fail(e); }
}
async function loadProcs(){
  try{
    const v = await (await api('/api/processes')).json();
    $('prows').innerHTML = v.map(x=>'<tr><td>'+x.pid+'</td><td>'+esc(x.exe)+'</td><td><small class="dim">'+esc(x.cmdline)+'</small></td><td>'+esc(x.harness_root||'')+'</td><td>'+esc(x.tool_exempt||'')+'</td></tr>').join('');
  }catch(e){ fail(e); }
}
async function loadWl(){
  try{
    const v = await (await api('/api/whitelist')).json();
    $('wrows').innerHTML = v.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.kind)+'</td><td>'+esc(x.value)+'</td><td>'+esc(x.note)+'</td><td><button class="mini" onclick="wlDel('+x.id+')">删除</button></td></tr>').join('');
  }catch(e){ fail(e); }
}
async function wlAdd(){
  await api('/api/whitelist', {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+TOKEN},
    body: JSON.stringify({kind:$('wl-kind').value, value:$('wl-value').value, note:$('wl-note').value})});
  loadWl();
}
async function wlDel(id){ await api('/api/whitelist?id='+id, {method:'DELETE'}); loadWl(); }

async function cfgLoad(){
  const r = await api('/api/config');
  $('cfg-text').value = await r.text();
}
async function cfgSave(){
  const r = await api('/api/config', {method:'PUT', body:$('cfg-text').value});
  alert(await r.text());
}
async function cfgReload(){ cfgLoad(); }


loadStatus(); loadVerdicts();
// SSE 实时推送（M4 替换 M1 的 3s 轮询）：verdict/audit 事件驱动刷新，
// 状态卡片保留 30s 慢刷兜底（uptime 等非事件型指标）
try {
  const es = new EventSource('/api/stream?token='+encodeURIComponent(TOKEN));
  es.onopen = () => { $('conn-dot').style.color = '#5dd97c'; };
  es.onerror = () => { $('conn-dot').style.color = '#ff5d5d'; };  // EventSource 自动重连
  es.addEventListener('verdict', () => { loadVerdicts(); loadStatus(); });
  es.addEventListener('audit', () => {
    const cur = document.querySelector('nav button.on');
    if (cur && cur.dataset.p === 'events') loadEvents();
  });
} catch (e) { fail(e); setInterval(()=>{ loadStatus(); loadVerdicts(); }, 3000); }
setInterval(loadStatus, 30000);
</script>
</body>
</html>
