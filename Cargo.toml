[workspace]
resolver = "2"
members = [
    "crates/hg-model",
    "crates/hg-core",
    "crates/hg-platform",
    "crates/hg-plat-win",
    "crates/hg-plat-linux",
    "crates/hg-plat-macos",
    "crates/hg-store",
    "crates/hg-notify",
    "crates/hg-web",
    "crates/hg-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# 依赖方向（技术设计 §2，无环）：
# hg-app → {hg-plat-*, hg-web, hg-store, hg-notify} → hg-core → hg-model ← hg-platform
[workspace.dependencies]
hg-model = { path = "crates/hg-model" }
hg-core = { path = "crates/hg-core" }
hg-platform = { path = "crates/hg-platform" }
hg-plat-win = { path = "crates/hg-plat-win" }
hg-plat-linux = { path = "crates/hg-plat-linux" }
hg-plat-macos = { path = "crates/hg-plat-macos" }
hg-store = { path = "crates/hg-store" }
hg-notify = { path = "crates/hg-notify" }
hg-web = { path = "crates/hg-web" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
dashmap = "6"
arc-swap = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
globset = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
toml = "0.8"
rust-embed = { version = "8", features = ["compression"] }
rand = "0.8"
ferrisetw = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_ToolHelp",
    "Wdk_System_Threading",
    "Win32_System_Kernel",
    # M4 P2.6：WFP FwpmFilterAdd0 封禁（System_Rpc 为 FwpmEngineOpen0 签名依赖）
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
] }

# 平台专属依赖声明（cargo 不允许 virtual workspace 里放 [target] 段——
# 门控放在各平台 crate 的 Cargo.toml（hg-plat-linux/macos 已按此组织，
# 效果等同任务原文的 workspace 级 target 门控，Windows 构建全绿）
aya = "0.13"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
