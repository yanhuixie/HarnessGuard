[package]
name = "hg-app"
description = "HarnessGuard 服务入口：配置加载、平台选择、组装装配（技术设计 §2）"
license.workspace = true
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "harnessguard"
path = "src/main.rs"

[dependencies]
hg-core = { workspace = true }
hg-model = { workspace = true }
hg-web = { workspace = true }
hg-store = { workspace = true }
hg-notify = { workspace = true }
hg-platform = { workspace = true }
hg-plat-win = { workspace = true }
hg-plat-linux = { workspace = true }
hg-plat-macos = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rand = { workspace = true }
axum = { workspace = true }

# M4 P2.8：SCM 服务宿主（仅 Windows；编译级验证，安装/启动待管理员实机复验）
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
